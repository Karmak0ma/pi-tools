# Reconstructed from other kitty.jpg Monokai reference.
# Linux needs its own font installation; Windows Terminal's fonts are not
# automatically visible to Kitty running inside WSL.
font_family JetBrainsMonoNL Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

cursor_shape beam
cursor #f8f8f2
foreground #f8f8f2
background #272822

color0 #272822
color1 #f92672
color2 #a6e22e
color3 #f4bf75
color4 #0087ff
color5 #ae81ff
color6 #a1efe4
color7 #f8f8f2
color8 #75715e
color9 #f92672
color10 #a6e22e
color11 #f4bf75
color12 #0087ff
color13 #ae81ff
color14 #a1efe4
color15 #f9f8f5

# Opaque output avoids mixing the Monokai background with the Windows desktop.
background_opacity 1.0

# Match the source without letting shell integration wrap sudo invocations.
shell_integration no-sudo

# Pi needs a distinct Shift+Enter sequence to insert a newline in its editor.
map shift+enter send_text all \x1b[13;2u

# Match the reference refresh setting to reduce tearing during Pi updates.
sync_to_monitor yes

# Copy selection directly to the Windows/system clipboard
copy_on_select clipboard

# Normal clipboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Make Shift+Insert paste the actual clipboard
map shift+insert paste_from_clipboard

# Middle mouse pastes clipboard
mouse_map middle release ungrabbed paste_from_clipboard

# Normal left-drag selection
mouse_map left press ungrabbed mouse_selection normal

# Allow selection even when tmux/neovim/etc. has grabbed the mouse
mouse_map shift+left press grabbed mouse_selection normal

# Hopefully prevents Kitty from jumping windwos
hide_window_decorations yes
