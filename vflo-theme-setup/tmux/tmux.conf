# Enable true color (24-bit RGB) support
# The 'Tc' flag enables terminfo-based RGB support
# The 'RGB' flag is the ANSI standard for true color
#set-option -ga terminal-overrides ",xterm-256color:Tc:RGB,tmux-256color:Tc:RGB,xterm-kitty:Tc:RGB,gnome-256color:Tc:RGB"
set -as terminal-overrides ',*:Tc:RGB:sitm=\E[3m'
set -g default-terminal "tmux-256color"

#set -g update-environment "DISPLAY"

# Changing ctrl b to ctrl a as the command button
unbind C-b
set -g prefix C-a

# scrollback size
set -g history-limit 500000

# split panes using | and -
bind / split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left previous-window
bind -n M-Right next-window

# Force tmux to send sequences Neovim understands for Home/End
bind-key -n Home send-keys Escape "OH"
bind-key -n End send-keys Escape "OF"

# Forward Shift+Enter to pi as CSI-u (the outer terminal maps the key to S-Enter)
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75

# reload tmux config with ctrl + a + r
 unbind r
 bind r \
     source-file ~/.tmux.conf \;\
         display 'Reloaded tmux config.'

# Visual Activity Monitoring between windows
setw -g monitor-activity off
set -g visual-activity off
set -g activity-action other

set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'

# Attach to a session if runs otherwise create a new one
#new-session -n $HOST

# Pass xterm keys to clients so vim can use ctrl arrow
set-window-option -g xterm-keys on

# Set ESC time to 0 for vim
set -sg escape-time 0

# Use m to toggle mouse mode
#unbind m
#bind m setw mousea

# Enable mouse reporting, but always pass pane wheel events to the application
# (Pi handles transcript scrolling itself in fullscreen mode.)
# set -g mouse on
bind-key -T root WheelUpPane send-keys -M
bind-key -T root WheelDownPane send-keys -M
set -g set-clipboard on

# Reorder windows with prefix shift arrows
bind-key S-Left swap-window -t -1
bind-key S-Right swap-window -t +1

set -g status on
set -g status-style bg=colour235
set -g message-command-style bg=colour238,fg=colour224
set -g message-style bg=colour238,fg=colour224
set -g status-justify centre
set -g status-left-length 100
set -g pane-active-border-style fg=colour154
set -g status-right-length 100
set -g status-right-style none
set -g status-left-style none
set -g pane-border-style fg=colour238
setw -g window-status-current-style bg=colour238,fg=colour9,bold
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-format '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics] #[fg=colour82] #I  #W #[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]'
setw -g window-status-activity-style blink
setw -g window-status-separator ''
#set -g status-left '#[fg=colour232,bg=colour154] #S #[fg=colour224,bg=colour238] #W #[fg=colour224,bg=colour235] #(uptime  | cut -d "," -f 4,5,6) '
set -g status-left '#{cpu_fg_color} CPU: #{cpu_icon} #{cpu_percentage} | #{ram_fg_color} RAM: #{ram_icon}: #{ram_percentage} | #(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}")'
set -g status-right '#[fg=colour40,bg=colour235] [#[fg=colour5,bg=colour235] %a, %d-%m-%Y  #[fg=colour224,bg=colour235] %r #[fg=colour40,bg=colour235]] #[fg=colour224,bg=colour238] #H #[fg=colour232,bg=colour154] '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
#set -g @plugin 'arl/gitmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
